name: Update Formula

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for release updates
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          updated=""
          table_rows=""
          for formula in Formula/*.rb; do
            git_url=$(grep -oP '(?:url "|head ")\Khttps://[^"]+\.git' "$formula" || true)
            if [ -z "$git_url" ]; then
              repo=$(grep -oP 'homepage "https://github.com/\K[^"/]+/[^"/]+' "$formula" || true)
              [ -n "$repo" ] && git_url="https://github.com/${repo}.git"
            fi
            if [ -z "$git_url" ]; then
              echo "::warning::$formula: could not determine git repository URL"
              continue
            fi
            latest=$(git -c credential.helper= ls-remote --tags "$git_url" 2>/dev/null | awk -F'/' '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
            if [ -z "$latest" ]; then
              echo "::warning::$formula: could not determine latest for $git_url"
              continue
            fi
            # robust current version extraction: prefer version "..." then tags/v then releases/download
            current=$(grep -oP 'version "\K[0-9]+\.[0-9]+\.[0-9]+' "$formula" | head -1 || true)
            if [ -z "$current" ]; then
              current=$(grep -oP 'tags/v\K[0-9]+\.[0-9]+\.[0-9]+' "$formula" | head -1 || true)
            fi
            if [ -z "$current" ]; then
              current=$(grep -oP 'releases/download/v\K[0-9]+\.[0-9]+\.[0-9]+' "$formula" | head -1 || true)
            fi
            if [ -z "$current" ]; then
              echo "::warning::$formula: could not determine current version"
              continue
            fi
            echo "::notice::$formula: current=$current latest=$latest"
            if [ "$latest" = "$current" ]; then
              continue
            fi
            # update version field and URLs containing the version
            sed -i -E "s/version \"[0-9]+\.[0-9]+\.[0-9]+\"/version \"${latest}\"/g" "$formula"
            sed -i "s|tags/v${current}|tags/v${latest}|g" "$formula"
            sed -i "s|releases/download/v${current}|releases/download/v${latest}|g" "$formula"
            sed -i "s|-v${current}|-v${latest}|g" "$formula"
            sed -i "s|_${current}_|_${latest}_|g" "$formula"

            # update sha256 for each versioned URL (skip livecheck url)
            urls=$(grep -oP 'url "\K[^"]+' "$formula" | grep -E "v${latest}|_${latest}_" || true)
            if [ -z "$urls" ]; then
              echo "::warning::$formula: no versioned urls found after patch"
            else
              tmp=$(mktemp)
              cp "$formula" "$tmp.base"
              idx=0
              while IFS= read -r url; do
                [ -z "$url" ] && continue
                idx=$((idx+1))
                echo "Fetching $url ..."
                if ! curl -fsSL "$url" -o /tmp/tarball; then
                  echo "::warning::Failed to fetch $url"
                  continue
                fi
                sha=$(sha256sum /tmp/tarball | cut -d' ' -f1)
                echo "  sha256 $sha"
                awk -v n="$idx" -v sha="$sha" 'BEGIN{c=0} /sha256 "/{c++; if(c==n) sub(/sha256 "[a-f0-9]*"/, "sha256 \"" sha "\"")} {print}' "$tmp.base" > "$tmp.new" && mv "$tmp.new" "$tmp.base"
                rm -f /tmp/tarball
              done <<< "$urls"
              cp "$tmp.base" "$formula"
              rm -f "$tmp.base" "$tmp.new"
            fi
            name=$(basename "$formula" .rb)
            updated="${updated}${formula}: v${current} -> v${latest}\n"
            table_rows="${table_rows}| \`${name}\` | \`${current}\` | \`${latest}\` |\n"
          done
          if [ -n "$updated" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            printf "%b" "$updated" > /tmp/updated.txt
          fi

      - name: Commit and push
        if: steps.releases.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then
            echo "no formula changes to commit"
            exit 0
          fi
          {
            echo "chore(deps): update formulas to latest releases"
            echo
            printf "%b" "$(cat /tmp/updated.txt)"
          } > /tmp/commit_msg.txt
          git commit -F /tmp/commit_msg.txt
          git push origin HEAD:main
